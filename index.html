<style>
  :root{
    --bg:#0c0c0e;
    --surface:#151518;
    --surface-2:#1c1c21;
    --border:#2a2a30;
    --gold:#c9a227;
    --gold-soft:#e3c363;
    --text:#f3f1ea;
    --text-dim:#96969f;
    --green:#5aa579;
    --green-bg:rgba(90,165,121,.12);
    --red:#c1584a;
    --red-bg:rgba(193,88,74,.12);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-weight:600;
    letter-spacing:.2px;
  }
  ::selection{background:var(--gold);color:#1a1a1a;}

  /* ---------- layout ---------- */
  #app{max-width:1180px;margin:0 auto;padding:0 20px 60px;}
  header.topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(12,12,14,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
    margin-bottom:28px;
  }
  .topbar-inner{max-width:1180px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;margin-right:auto;}
  .brand-mark{
    width:38px;height:38px;border-radius:9px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:#0c0c0e;
    box-shadow:0 3px 10px rgba(0,0,0,.4);
    flex-shrink:0;
  }
  .brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .brand-text .t1{font-size:16px;font-weight:700;}
  .brand-text .t2{font-size:11.5px;color:var(--text-dim);letter-spacing:.5px;text-transform:uppercase;}

  nav.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px;flex-wrap:wrap;}
  nav.tabs button{
    border:none;background:transparent;color:var(--text-dim);
    padding:8px 16px;border-radius:999px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:background .15s,color .15s;white-space:nowrap;
  }
  nav.tabs button.active{background:var(--gold);color:#181611;font-weight:600;}
  nav.tabs button:not(.active):hover{color:var(--text);}

  .topbar-actions{display:flex;align-items:center;gap:10px;}
  select, input, textarea{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:7px;padding:8px 10px;font-size:13px;font-family:inherit;
  }
  select:focus, input:focus, textarea:focus{outline:1px solid var(--gold);border-color:var(--gold);}

  button.btn{
    font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
    border-radius:7px;padding:9px 16px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);transition:border-color .15s,transform .1s;
  }
  button.btn:hover{border-color:var(--gold);}
  button.btn:active{transform:scale(.98);}
  button.btn-gold{background:var(--gold);color:#181611;border-color:var(--gold);}
  button.btn-gold:hover{background:var(--gold-soft);}
  button.btn-ghost{background:transparent;}
  button.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}
  button.btn-danger-ghost{background:transparent;color:var(--red);border-color:transparent;}
  button.btn-danger-ghost:hover{background:var(--red-bg);}
  button.btn-block{width:100%;text-align:left;padding:13px 16px;}

  /* ---------- cards / sections ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
  .section-title{font-size:19px;margin:0 0 4px;}
  .section-sub{color:var(--text-dim);font-size:12.5px;margin:0 0 18px;}
  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:1.1fr 1fr;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:880px){.grid-2,.grid-4{grid-template-columns:1fr;}}

  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
  .kpi .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);margin-bottom:8px;}
  .kpi .value{font-family:Georgia,serif;font-size:24px;font-weight:700;}
  .kpi .value.pos{color:var(--green);}
  .kpi .value.neg{color:var(--red);}
  .kpi .sub{font-size:11.5px;color:var(--text-dim);margin-top:4px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text-dim);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(255,255,255,.02);}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;}
  .tag-receita{background:var(--green-bg);color:var(--green);}
  .tag-despesa{background:var(--red-bg);color:var(--red);}
  .tag-conciliado{background:var(--green-bg);color:var(--green);}
  .tag-pendente{background:rgba(201,162,39,.14);color:var(--gold-soft);}
  .tag-salvar{background:rgba(150,150,159,.16);color:var(--text-dim);}
  .tag-exportar{background:rgba(201,162,39,.16);color:var(--gold-soft);}
  .empty{color:var(--text-dim);text-align:center;padding:40px 10px;font-size:13px;}

  form.entry-form{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;}
  form.entry-form .field{display:flex;flex-direction:column;gap:5px;}
  form.entry-form label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;}
  form.entry-form .span-2{grid-column:span 2;}
  form.entry-form .span-3{grid-column:span 3;}
  form.entry-form .span-6{grid-column:span 6;}
  @media(max-width:880px){form.entry-form{grid-template-columns:repeat(2,1fr);}form.entry-form .span-2,form.entry-form .span-3,form.entry-form .span-6{grid-column:span 2;}}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  .toolbar .spacer{flex:1;}

  .bar-row{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;margin-bottom:10px;font-size:12.5px;}
  .bar-track{background:var(--surface-2);border-radius:5px;height:9px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:5px;background:var(--gold);}

  footer.foot{text-align:center;color:var(--text-dim);font-size:11.5px;margin-top:40px;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(6,6,7,.72);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;
  }
  .modal-card{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:26px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal-card h3{margin:0 0 6px;font-size:19px;}
  .modal-card .field{margin:16px 0 6px;}
  .modal-actions{display:flex;flex-direction:column;gap:8px;margin-top:18px;}
  .modal-actions button{width:100%;padding:11px 14px;}
  .modal-cancel-row{text-align:center;margin-top:10px;}
  .modal-cancel-row button{background:transparent;border:none;color:var(--text-dim);font-size:12.5px;cursor:pointer;font-family:inherit;}
  .modal-cancel-row button:hover{color:var(--text);}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--gold);color:var(--text);padding:10px 18px;border-radius:8px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  .loading{color:var(--text-dim);padding:40px;text-align:center;}

  /* ---------- modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(6,6,7,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-overlay.hidden{display:none;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .modal h3{margin:0 0 6px;font-size:18px;}
  .modal p{color:var(--text-dim);font-size:12.5px;margin:0 0 16px;}
  .modal .field{display:flex;flex-direction:column;gap:5px;margin-bottom:16px;}
  .modal .field label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;}
  .modal .field input{width:100%;}
  .modal-option{display:block;margin-bottom:10px;border-radius:9px;}
  .modal-option .opt-title{font-size:13.5px;font-weight:700;}
  .modal-option .opt-sub{font-size:11.5px;font-weight:400;color:var(--text-dim);margin-top:2px;}
  .modal-option.gold .opt-sub{color:#4a3f14;}
  .modal-cancel-row{text-align:right;margin-top:6px;}
</style>
</head>

<div id="app"></div>
<div id="toast" class="toast"></div>

const WORKSPACES_KEY = 'lorian_workspaces_v1';

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ---------------- armazenamento ----------------
   Camada 1 (sempre): cache neste navegador (localStorage), por área de
   trabalho — nunca perde o que você digitou neste aparelho, mesmo sem
   internet.
   Camada 2 (ao clicar em "Salvar" ou "Exportar"): sincroniza com a planilha
   Google daquela área específica.
------------------------------------------------- */
function cacheLocally(){
  if(!state.activeWorkspaceId) return;
  try{
    localStorage.setItem(cacheKeyFor(state.activeWorkspaceId), JSON.stringify({transactions:state.transactions, history:state.history, dirty:!!state.dirty}));
  }catch(e){ /* armazenamento local indisponível — segue só em memória */ }
}
function loadLocalCache(){
  state.transactions = []; state.history = []; state.dirty = false;
  if(!state.activeWorkspaceId) return;
  try{
    const raw = localStorage.getItem(cacheKeyFor(state.activeWorkspaceId));
    if(raw){ const c = JSON.parse(raw); state.transactions = c.transactions||[]; state.history = c.history||[]; state.dirty = !!c.dirty; }
  }catch(e){ /* ignora cache corrompido */ }
}
// Chame isto (em vez de cacheLocally direto) sempre que o USUÁRIO alterar algo
// localmente — marca que este aparelho tem mudanças ainda não enviadas à
// planilha, para o app nunca as sobrescrever sozinho ao recarregar.
function touch(){
  state.dirty = true;
  cacheLocally();
}

function loadWorkspaces(){
  try{
    const raw = localStorage.getItem(WORKSPACES_KEY);
    state.workspaces = raw ? JSON.parse(raw) : [];
  }catch(e){ state.workspaces = []; }
  // área ativa lembrada separadamente, também por navegador
  try{ state.activeWorkspaceId = localStorage.getItem(WORKSPACES_KEY+'_active') || (state.workspaces[0]?state.workspaces[0].id:''); }
  catch(e){ state.activeWorkspaceId = state.workspaces[0]?state.workspaces[0].id:''; }
}
function saveWorkspacesList(){
  try{ localStorage.setItem(WORKSPACES_KEY, JSON.stringify(state.workspaces)); }catch(e){}
}
function setActiveWorkspace(id){
  state.activeWorkspaceId = id;
  try{ localStorage.setItem(WORKSPACES_KEY+'_active', id); }catch(e){}
  const ws = activeWorkspace();
  CATEGORIES = CATEGORY_PRESETS[ws?.categoryPreset] || CATEGORY_PRESETS.ecommerce;
  state.filterCategory = 'all';
  loadLocalCache();
}
function upsertWorkspace(ws){
  const idx = state.workspaces.findIndex(w=>w.id===ws.id);
  if(idx===-1) state.workspaces.push(ws); else state.workspaces[idx]=ws;
  saveWorkspacesList();
}
function removeWorkspace(id){
  state.workspaces = state.workspaces.filter(w=>w.id!==id);
  saveWorkspacesList();
  try{ localStorage.removeItem(cacheKeyFor(id)); }catch(e){}
  if(state.activeWorkspaceId===id){
    setActiveWorkspace(state.workspaces[0] ? state.workspaces[0].id : '');
  }
}
function buildUrl_(){
  const ws = activeWorkspace();
  if(!ws || !ws.scriptUrl) return '';
  const sep = ws.scriptUrl.includes('?') ? '&' : '?';
  return ws.scriptUrl + sep + 'token=' + encodeURIComponent(ws.scriptToken||'');
}

async function init(){
  try{
    loadWorkspaces();
    const ws = activeWorkspace();
    CATEGORIES = CATEGORY_PRESETS[ws?.categoryPreset] || CATEGORY_PRESETS.ecommerce;
    loadLocalCache();
    state.dataLoaded = true;
    render();
    if(ws){
      if(state.dirty){
        // há mudanças feitas neste aparelho que ainda não foram enviadas —
        // NUNCA sobrescrever sozinho com o que está na planilha.
        state.syncState = 'error';
        showToast('Você tem lançamentos deste aparelho ainda não sincronizados. Clique em "Salvar / Exportar" para enviá-los antes de atualizar.');
        render();
      }else{
        refreshFromServer(true);
      }
    }else{
      state.configOpen = true;
      render();
    }
  }catch(e){
    document.getElementById('app').innerHTML =
      '<div class="loading">Ocorreu um erro ao carregar o app. Recarregue a página. ('+(e&&e.message?e.message:e)+')</div>';
  }
}

async function refreshFromServer(silent){
  const ws = activeWorkspace();
  if(!ws) return;
  if(!silent && state.dirty){
    const proceed = confirm('Você tem alterações não sincronizadas neste aparelho. Atualizar agora vai SUBSTITUÍ-LAS pelos dados da planilha. Deseja continuar mesmo assim?');
    if(!proceed) return;
  }
  state.syncState = 'syncing'; render();
  try{
    const res = await fetch(buildUrl_(), {method:'GET'});
    const data = await res.json();
    if(!res.ok || data.ok===false || data.error) throw new Error(data.error || ('HTTP '+res.status));
    state.transactions = (data.transactions||[]).map(normalizeTx);
    state.history = (data.history||[]).map(normalizeHist);
    state.dirty = false;
    cacheLocally();
    state.syncState = 'ok';
    state.lastSync = new Date().toISOString();
    if(!silent) showToast('Dados atualizados com a planilha de "'+ws.name+'".');
  }catch(e){
    state.syncState = 'error';
    showToast('Não foi possível ler a planilha (' + e.message + '). Mostrando a última cópia salva neste aparelho.');
  }
  render();
}

async function pushToServer(){
  const ws = activeWorkspace();
  if(!ws){
    showToast('Configure uma área de trabalho antes de salvar (botão de engrenagem).');
    return false;
  }
  state.syncState = 'syncing'; render();
  try{
    const res = await fetch(buildUrl_(), {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // evita preflight CORS no Apps Script
      body: JSON.stringify({transactions:state.transactions, history:state.history}),
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok || data.ok===false) throw new Error(data.error || ('HTTP '+res.status));
    state.dirty = false;
    cacheLocally();
    state.syncState = 'ok';
    state.lastSync = new Date().toISOString();
    render();
    return true;
  }catch(e){
    state.syncState = 'error';
    cacheLocally();
    render();
    showToast('Não sincronizou com a planilha (' + e.message + '). Os dados ficaram salvos apenas neste aparelho.');
    return false;
  }
}

function normalizeTx(t){
  return {
    id: String(t.id||uid()),
    type: t.type==='receita'?'receita':'despesa',
    categoryId: t.categoryId||'',
    date: String(t.date||'').slice(0,10),
    value: Number(t.value)||0,
    nf: t.nf ? String(t.nf) : '',
    description: t.description||'',
    paymentMethod: t.paymentMethod||'',
    partner: t.partner||'',
    reconciled: t.reconciled===true || t.reconciled==='TRUE' || t.reconciled===1,
    bankNote: t.bankNote||'',
  };
}
function normalizeHist(h){
  return {
    id: String(h.id||uid()),
    timestamp: String(h.timestamp||new Date().toISOString()),
    action: h.action||'salvar',
    period: h.period||'all',
    totalLancamentos: Number(h.totalLancamentos)||0,
    receitaBruta: Number(h.receitaBruta)||0,
    despesasTotais: Number(h.despesasTotais)||0,
    lucroLiquido: Number(h.lucroLiquido)||0,
    note: h.note||'',
  };
}

/* ---------------- derived data helpers ---------------- */
function availableMonths(){
  const set = new Set(state.transactions.map(t=>t.date.slice(0,7)));
  const now = new Date(); set.add(now.toISOString().slice(0,7));
  return Array.from(set).sort().reverse();
}
function inPeriod(t){ return state.period==='all' ? true : t.date.slice(0,7)===state.period; }
function periodTransactions(){ return state.transactions.filter(inPeriod); }

function dreData(list){
  const sumGroup = g => list.filter(t=>catById(t.categoryId)?.group===g).reduce((s,t)=>s+t.value,0);
  const receitaBruta = sumGroup('receita');
  const deducoes = sumGroup('deducao');
  const receitaLiquida = receitaBruta - deducoes;
  const cmv = sumGroup('cmv');
  const lucroBruto = receitaLiquida - cmv;
  const opex = sumGroup('operacional');
  const lucroLiquido = lucroBruto - opex;
  const naoOperacional = sumGroup('nao_operacional');
  const resultadoFinal = lucroLiquido - naoOperacional;
  return {receitaBruta,deducoes,receitaLiquida,cmv,lucroBruto,opex,lucroLiquido,naoOperacional,resultadoFinal};
}

    ${renderConfigModal()}
  `;
  attachHeaderEvents();
  attachTabEvents();
  if(state.modalOpen) attachModalEvents();
  if(state.configOpen) attachConfigEvents();
}

function attachHeaderEvents(){
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.addEventListener('click', ()=>{ state.activeTab=b.dataset.tab; state.editingId=null; render(); });
  });
  document.getElementById('periodSelect').addEventListener('change', e=>{ state.period=e.target.value; render(); });
  document.getElementById('openModalBtn').addEventListener('click', ()=>{ state.modalOpen=true; render(); });
  document.getElementById('openConfigBtn').addEventListener('click', ()=>{ state.configOpen=true; state.configEditingId=null; render(); });
  document.getElementById('refreshBtn').addEventListener('click', ()=> refreshFromServer(false));
  const wsSel = document.getElementById('workspaceSelect');
  if(wsSel) wsSel.addEventListener('change', async e=>{
    if(state.dirty){
      const proceed = confirm('Você tem alterações não sincronizadas na área atual. Trocar de área agora vai deixá-las de lado até você voltar aqui e salvar. Continuar?');
      if(!proceed){ wsSel.value = state.activeWorkspaceId; return; }
    }
    setActiveWorkspace(e.target.value);
    state.period='all'; state.activeTab='lancamentos';
    render();
    refreshFromServer(true);
  });
}

function renderTab(){
  if(state.activeTab==='lancamentos') return renderLancamentos();
  if(state.activeTab==='conciliacao') return renderConciliacao();
  if(state.activeTab==='dre') return renderDRE();
  if(state.activeTab==='dashboard') return renderDashboard();
  if(state.activeTab==='historico') return renderHistorico();
  return '';
}

/* ================= LANÇAMENTOS ================= */
function renderLancamentos(){
  const editing = state.editingId ? state.transactions.find(t=>t.id===state.editingId) : null;
  const list = periodTransactions()
    .filter(t=> state.filterType==='all' || t.type===state.filterType)
    .filter(t=> state.filterCategory==='all' || t.categoryId===state.filterCategory)
    .sort((a,b)=> b.date.localeCompare(a.date));

  const totalComNF = list.filter(t=>t.nf && t.nf.trim()).reduce((s,t)=>s+t.value,0);
  const totalSemNF = list.filter(t=>!t.nf || !t.nf.trim()).reduce((s,t)=>s+t.value,0);

  return `
  <section class="card" style="margin-bottom:20px;">
    <h2 class="section-title">${editing?'Editar lançamento':'Novo lançamento'}</h2>
    <p class="section-sub">Registre receitas, despesas e a nota fiscal vinculada.</p>
    <form class="entry-form" id="entryForm">
      <div class="field span-1"><label>Tipo</label>
        <select name="type" id="fType">
          <option value="receita" ${editing?.type==='receita'?'selected':''}>Receita</option>
          <option value="despesa" ${(!editing||editing?.type==='despesa')?'selected':''}>Despesa</option>
        </select>
      </div>
      <div class="field span-2"><label>Categoria</label>
        <select name="categoryId" id="fCategory"></select>
      </div>
      <div class="field"><label>Data</label>
        <input type="date" name="date" value="${editing?editing.date:new Date().toISOString().slice(0,10)}" required>
      </div>
      <div class="field"><label>Valor (R$)</label>
        <input type="number" step="0.01" min="0" name="value" value="${editing?editing.value:''}" placeholder="0,00" required>
      </div>
      <div class="field"><label>Nº da NF</label>
        <input type="text" name="nf" value="${editing?editing.nf||'':''}" placeholder="opcional">
      </div>
      <div class="field span-3"><label>Descrição</label>
        <input type="text" name="description" value="${editing?editing.description||'':''}" placeholder="Ex: Vendas da semana, compra de insumos…" required>
      </div>
      <div class="field"><label>Pagamento</label>
        <select name="paymentMethod">${PAYMENT_METHODS.map(p=>`<option ${editing?.paymentMethod===p?'selected':''}>${p}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Sócio</label>
        <input type="text" name="partner" value="${editing?editing.partner||'':''}" placeholder="opcional">
      </div>
      <div class="field span-6" style="flex-direction:row;gap:10px;justify-content:flex-end;">
        ${editing?`<button type="button" class="btn btn-ghost" id="cancelEdit">Cancelar</button>`:''}
        <button type="submit" class="btn btn-gold">${editing?'Salvar alterações':'Adicionar lançamento'}</button>
      </div>
    </form>
  </section>

  <div class="grid grid-4" style="margin-bottom:20px;">
    <div class="kpi"><div class="label">Lançamentos no período</div><div class="value">${list.length}</div></div>
    <div class="kpi"><div class="label">Total com NF</div><div class="value pos">${fmtMoney(totalComNF)}</div></div>
    <div class="kpi"><div class="label">Total sem NF</div><div class="value" style="color:var(--gold-soft)">${fmtMoney(totalSemNF)}</div></div>
    <div class="kpi"><div class="label">Período selecionado</div><div class="value" style="font-size:16px;">${state.period==='all'?'Todo o período':monthLabel(state.period)}</div></div>
  </div>

  <section class="card">
    <div class="toolbar">
      <select id="filterType">
        <option value="all">Todos os tipos</option>
        <option value="receita" ${state.filterType==='receita'?'selected':''}>Receitas</option>
        <option value="despesa" ${state.filterType==='despesa'?'selected':''}>Despesas</option>
      </select>
      <select id="filterCategory">
        <option value="all">Todas as categorias</option>
        ${CATEGORIES.map(c=>`<option value="${c.id}" ${state.filterCategory===c.id?'selected':''}>${c.label}</option>`).join('')}
      </select>
      <div class="spacer"></div>
    </div>
    ${list.length===0? `<div class="empty">Nenhum lançamento neste período. Adicione o primeiro acima.</div>` : `
    <table>
      <thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>NF</th><th>Sócio</th><th class="num">Valor</th><th></th></tr></thead>
      <tbody>
        ${list.map(t=>`
          <tr>
            <td>${fmtDate(t.date)}</td>
            <td><span class="tag tag-${t.type}">${t.type==='receita'?'Receita':'Despesa'}</span></td>
            <td>${catById(t.categoryId)?.label||'—'}</td>
            <td>${t.description}</td>
            <td>${t.nf? t.nf : '<span style="color:var(--text-dim)">—</span>'}</td>
            <td>${t.partner||'<span style="color:var(--text-dim)">—</span>'}</td>
            <td class="num" style="color:${t.type==='receita'?'var(--green)':'var(--red)'}">${fmtMoney(t.value)}</td>
            <td style="white-space:nowrap;">
              <button class="btn btn-sm btn-ghost" data-edit="${t.id}">Editar</button>
              <button class="btn btn-sm btn-danger-ghost" data-del="${t.id}">Excluir</button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>`}
  </section>`;
}

function fillCategoryOptions(selectedType, selectedCategory){
  const sel = document.getElementById('fCategory');
  const opts = CATEGORIES.filter(c=>c.type===selectedType);
  sel.innerHTML = opts.map(c=>`<option value="${c.id}" ${c.id===selectedCategory?'selected':''}>${c.label}</option>`).join('');
}

function attachTabEvents(){
  if(state.activeTab==='lancamentos'){
    const editing = state.editingId ? state.transactions.find(t=>t.id===state.editingId) : null;
    const typeSel = document.getElementById('fType');
    fillCategoryOptions(typeSel.value, editing?editing.categoryId:null);
    typeSel.addEventListener('change', ()=>fillCategoryOptions(typeSel.value,null));

    document.getElementById('entryForm').addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const payload = {
        type: fd.get('type'),
        categoryId: fd.get('categoryId'),
        date: fd.get('date'),
        value: parseFloat(fd.get('value')),
        nf: fd.get('nf').trim(),
        description: fd.get('description').trim(),
        paymentMethod: fd.get('paymentMethod'),
        partner: fd.get('partner').trim(),
      };
      if(!payload.value || payload.value<=0){ showToast('Informe um valor válido.'); return; }
      if(state.editingId){
        const idx = state.transactions.findIndex(t=>t.id===state.editingId);
        state.transactions[idx] = {...state.transactions[idx], ...payload};
        showToast('Lançamento atualizado.');
      }else{
        state.transactions.push({id:uid(), reconciled:false, bankNote:'', ...payload});
        showToast('Lançamento adicionado.');
      }
      state.editingId = null;
      touch(); render();
    });
    const cancelBtn = document.getElementById('cancelEdit');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ state.editingId=null; render(); });

    document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>{ state.editingId=b.dataset.edit; render(); }));
    document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
      if(confirm('Excluir este lançamento?')){
        state.transactions = state.transactions.filter(t=>t.id!==b.dataset.del);
        touch(); render();
      }
    }));
    document.getElementById('filterType').addEventListener('change', e=>{ state.filterType=e.target.value; render(); });
    document.getElementById('filterCategory').addEventListener('change', e=>{ state.filterCategory=e.target.value; render(); });
  }

  if(state.activeTab==='conciliacao') attachConciliacaoEvents();
  if(state.activeTab==='historico') attachHistoricoEvents();
}

const CATEGORY_PALETTE = ['#c9a227','#d98c3d','#b2562f','#e3c363','#8a6f18','#c1584a','#9c6b2f','#e0a95c'];

function renderCategoryBars(list){
  const totals = {};
  list.forEach(t=>{ totals[t.categoryId] = (totals[t.categoryId]||0) + t.value; });
  const entries = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  if(entries.length===0) return `<div class="empty">Sem despesas neste período.</div>`;
  const max = Math.max(...entries.map(e=>e[1]));
  const total = entries.reduce((s,e)=>s+e[1],0);
  return entries.map(([catId,val],i)=>{
    const pct = total>0 ? Math.round(val/total*100) : 0;
    const color = CATEGORY_PALETTE[i % CATEGORY_PALETTE.length];
    return `
    <div class="bar-row">
      <div>${catById(catId)?.label||catId}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(val/max*100).toFixed(1)}%;background:${color};"></div></div>
      <div class="num">${fmtMoney(val)} <span style="color:var(--text-dim);font-size:11px;">(${pct}%)</span></div>
    </div>`;
  }).join('');
}

/* ================= DASHBOARD ================= */
// Em vez de sempre mostrar 12 meses fixos (a maioria vazios quando a base é
// nova), mostra a partir do primeiro lançamento até o mês atual — no máximo
// 12 meses, no mínimo 3 (para sempre dar algum contexto de tendência).
function relevantMonths(){
  const dates = state.transactions.map(t=>t.date.slice(0,7));
  const now = new Date().toISOString().slice(0,7);
  let arr;
  if(dates.length===0){
    arr=[]; const d=new Date();
    for(let i=5;i>=0;i--){ const dt=new Date(d.getFullYear(), d.getMonth()-i, 1); arr.push(dt.toISOString().slice(0,7)); }
    return arr;
  }
  const earliest = dates.sort()[0];
  const [ey,em0] = earliest.split('-').map(Number);
  const [ny,nm0] = now.split('-').map(Number);
  arr = []; let y=ey, m=em0;
  while(y<ny || (y===ny && m<=nm0)){
    arr.push(`${y}-${String(m).padStart(2,'0')}`);
    m++; if(m>12){ m=1; y++; }
  }
  if(arr.length>12) arr = arr.slice(arr.length-12);
  while(arr.length<3){
    const [fy,fm] = arr[0].split('-').map(Number);
    let py=fy, pm=fm-1; if(pm<1){ pm=12; py--; }
    arr.unshift(`${py}-${String(pm).padStart(2,'0')}`);
  }
  return arr;
}
function renderDashboard(){

    <div class="kpi"><div class="label">% conciliado</div><div class="value">${pctConc}%</div><div class="sub">${totalConc} de ${list.length} lançamentos</div></div>
  </div>

  <section class="card" style="margin-bottom:20px;">

function renderMonthlyChart(data){
  const w=1080, h=260, padL=44, padB=28, padT=14;
  const max = Math.max(1, ...data.map(x=>Math.max(x.receita,x.despesa))) * 1.12;
  const bw = (w-padL)/data.length;
  const plotH = h-padB-padT;
  const scaleY = v => plotH * (v/max);
  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const y = h-padB-plotH*f;
    return `<line x1="${padL}" y1="${y}" x2="${w-4}" y2="${y}" stroke="var(--border)" stroke-width="1"/>
            <text x="2" y="${y+3}" font-size="9" fill="var(--text-dim)">${f===0?'0':fmtMoneyShort(max*f)}</text>`;
  }).join('');
  let bars = '';
  const currentMonth = new Date().toISOString().slice(0,7);
  data.forEach((x,i)=>{
    const cx = padL + i*bw;
    const hr = scaleY(x.receita), hd = scaleY(x.despesa);
    const gw = bw*0.32;
    const isCurrent = x.m===currentMonth;
    if(isCurrent) bars += `<rect x="${cx}" y="${padT}" width="${bw}" height="${plotH}" fill="rgba(201,162,39,.06)"/>`;
    bars += `<rect x="${cx+bw*0.12}" y="${h-padB-hr}" width="${gw}" height="${Math.max(hr,hr>0?2:0)}" fill="var(--green)" rx="2"><title>Receita ${monthLabel(x.m)}: ${fmtMoney(x.receita)}</title></rect>`;
    bars += `<rect x="${cx+bw*0.52}" y="${h-padB-hd}" width="${gw}" height="${Math.max(hd,hd>0?2:0)}" fill="var(--red)" rx="2"><title>Despesa ${monthLabel(x.m)}: ${fmtMoney(x.despesa)}</title></rect>`;
    if(hr>18) bars += `<text x="${cx+bw*0.12+gw/2}" y="${h-padB-hr-4}" font-size="9" fill="var(--green)" text-anchor="middle">${fmtMoneyShort(x.receita)}</text>`;
    if(hd>18) bars += `<text x="${cx+bw*0.52+gw/2}" y="${h-padB-hd-4}" font-size="9" fill="var(--red)" text-anchor="middle">${fmtMoneyShort(x.despesa)}</text>`;
    bars += `<text x="${cx+bw/2}" y="${h-9}" font-size="9.5" fill="${isCurrent?'var(--gold-soft)':'var(--text-dim)'}" text-anchor="middle">${MONTH_NAMES[parseInt(x.m.slice(5),10)-1].slice(0,3)}/${x.m.slice(2,4)}</text>`;
  });
  return `
  <div style="display:flex;gap:16px;font-size:11.5px;color:var(--text-dim);margin-bottom:8px;">
    <span><span style="display:inline-block;width:9px;height:9px;background:var(--green);border-radius:2px;margin-right:5px;"></span>Receita</span>
    <span><span style="display:inline-block;width:9px;height:9px;background:var(--red);border-radius:2px;margin-right:5px;"></span>Despesa</span>
  </div>
  <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">${gridLines}${bars}</svg>`;
}
function fmtMoneyShort(v){
  if(Math.abs(v)>=1000) return (v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k';
  return v.toLocaleString('pt-BR',{maximumFractionDigits:0});
}

function renderMarginChart(data){
  const w=520, h=210, padL=38, padB=26, padT=16;
  const vals = data.map(x=>x.margem);
  const min = Math.min(0, ...vals), max = Math.max(10, ...vals);
  const range = (max-min)||1;
  const stepX = (w-padL-10)/(data.length-1||1);
  const y = v => h-padB - ((v-min)/range)*(h-padB-padT);
  const pts = data.map((x,i)=>({x:padL+i*stepX, y:y(x.margem), v:x.margem, m:x.m}));
  const linePts = pts.map(p=>`${p.x},${p.y}`).join(' ');
  const zeroY = y(0);
  const areaPath = `M${pts[0].x},${zeroY} ` + pts.map(p=>`L${p.x},${p.y}`).join(' ') + ` L${pts[pts.length-1].x},${zeroY} Z`;
  const gridTexts = [max, 0, min].filter((v,i,arr)=>arr.indexOf(v)===i).map(v=>{
    const yy=y(v);
    return `<line x1="${padL}" y1="${yy}" x2="${w-6}" y2="${yy}" stroke="var(--border)" stroke-dasharray="3,3"/>
            <text x="2" y="${yy+3}" font-size="9" fill="var(--text-dim)">${v.toFixed(0)}%</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
    <defs>
      <linearGradient id="marginFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--gold)" stop-opacity=".35"/>
        <stop offset="100%" stop-color="var(--gold)" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${gridTexts}
    <path d="${areaPath}" fill="url(#marginFill)"/>
    <polyline points="${linePts}" fill="none" stroke="var(--gold)" stroke-width="2.5"/>
    ${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3.2" fill="${p.v>=0?'var(--green)':'var(--red)'}" stroke="var(--surface)" stroke-width="1.2"><title>${monthLabel(p.m)}: ${p.v.toFixed(1)}%</title></circle>`).join('')}
    ${pts.map((p,i)=> (i===0||i===pts.length-1||pts.length<=6) ? `<text x="${p.x}" y="${h-6}" font-size="9" fill="var(--text-dim)" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}">${p.m.slice(5)}/${p.m.slice(2,4)}</text>` : '').join('')}
  </svg>`;
}

}
function attachModalEvents(){
  document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay' && !state.modalBusy){ state.modalOpen=false; render(); } });
  const cancelBtn = document.getElementById('modalCancel');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ if(state.modalBusy) return; state.modalOpen=false; render(); });

  const saveBtn = document.getElementById('modalSaveOnly');
  const exportBtn = document.getElementById('modalExport');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    if(state.modalBusy) return;
    const note = document.getElementById('modalNote').value.trim();
    state.modalBusy = 'salvar'; render();
    recordHistory('salvar', note);
    const ok = await pushToServer();
    state.modalBusy = false; state.modalOpen = false; render();
    showToast(ok ? 'Salvo e sincronizado com a planilha.' : 'Salvo neste aparelho — sincronização falhou.');
  });
  if(exportBtn) exportBtn.addEventListener('click', async ()=>{
    if(state.modalBusy) return;
    const note = document.getElementById('modalNote').value.trim();
    state.modalBusy = 'exportar'; render();
    recordHistory('exportar', note);
    const ok = await pushToServer();
    exportExcel();
    state.modalBusy = false; state.modalOpen = false; render();
    showToast(ok ? 'Exportado e sincronizado com a planilha.' : 'Excel exportado, mas a sincronização falhou.');
  });
}

/* ================= HISTÓRICO: registrar snapshot (localmente; some para o servidor no próximo pushToServer) ================= */
function recordHistory(action, note){
  const list = periodTransactions();
  const d = dreData(list);
  const entry = {
    id: uid(),
    timestamp: new Date().toISOString(),
    action,
    period: state.period,
    totalLancamentos: list.length,
    receitaBruta: d.receitaBruta,
    despesasTotais: d.deducoes + d.cmv + d.opex,
    lucroLiquido: d.lucroLiquido,
    note: note || '',
  };
  state.history.unshift(entry);
  touch();
  return entry;
}

/* ================= CONFIGURAÇÃO: áreas de trabalho (Lorian, Consultoria, etc.) ================= */
function renderConfigModal(){
  if(!state.configOpen) return '';
  const editing = state.configEditingId ? state.workspaces.find(w=>w.id===state.configEditingId) : null;
  const showForm = !!state.configEditingId || state.workspaces.length===0;

  const listHtml = state.workspaces.length===0 ? '' : `
    <div style="margin-bottom:14px;">
      ${state.workspaces.map(w=>`
        <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);">
          <div style="flex:1;">
            <div style="font-weight:600;">${w.name}</div>
            <div style="font-size:11px;color:var(--text-dim);">${w.categoryPreset==='servicos'?'Categorias de Serviços':'Categorias de E-commerce'}</div>
          </div>
          <button class="btn btn-sm btn-ghost" data-edit-ws="${w.id}">Editar</button>
          <button class="btn btn-sm btn-danger-ghost" data-del-ws="${w.id}">Remover</button>
        </div>`).join('')}
    </div>`;

  const formHtml = !showForm ? `<button class="btn btn-gold btn-block" id="addWsBtn">+ Adicionar nova área</button>` : `
    <div class="field">
      <label>Nome da área</label>
      <input type="text" id="wsNameInput" value="${editing?editing.name:''}" placeholder="Ex: Lorian, Consultoria da Camila…">
    </div>
    <div class="field">
      <label>Tipo de categorias</label>
      <select id="wsPresetInput">
        <option value="ecommerce" ${(!editing||editing.categoryPreset==='ecommerce')?'selected':''}>E-commerce (vendas, frete, CMV…)</option>
        <option value="servicos" ${editing?.categoryPreset==='servicos'?'selected':''}>Serviços/Consultoria (honorários, projetos…)</option>
      </select>
    </div>
    <div class="field">
      <label>URL do Web App</label>
      <input type="text" id="wsUrlInput" value="${editing?editing.scriptUrl:''}" placeholder="https://script.google.com/macros/s/…/exec">
    </div>
    <div class="field">
      <label>Token secreto</label>
      <input type="text" id="wsTokenInput" value="${editing?editing.scriptToken:''}" placeholder="o mesmo SECRET_TOKEN definido no script">
    </div>
    <button class="btn btn-gold btn-block" id="wsTestBtn" style="margin-bottom:8px;">Testar conexão</button>
    <button class="btn btn-block" id="wsSaveBtn" style="margin-bottom:10px;">${editing?'Salvar alterações':'Adicionar e sincronizar'}</button>
    <div id="wsResult" style="font-size:12.5px;color:var(--text-dim);min-height:18px;margin-bottom:4px;"></div>
    ${state.workspaces.length>0?`<div class="modal-cancel-row"><button class="btn btn-ghost btn-sm" id="wsFormCancel">Voltar para a lista</button></div>`:''}
  `;

  return `
  <div class="modal-overlay" id="configOverlay">
    <div class="modal">
      <h3>Áreas de trabalho</h3>
      <p class="section-sub" style="margin-bottom:12px;">Cada área aponta para uma planilha própria — dados de áreas diferentes nunca se misturam. Compartilhe o link+token de cada área só com quem deve ver aqueles dados.</p>
      ${listHtml}
      ${formHtml}
      <div class="modal-cancel-row">
        <button class="btn btn-ghost btn-sm" id="configCancel">Fechar</button>
      </div>
    </div>
  </div>`;
}

function attachConfigEvents(){
  document.getElementById('configOverlay').addEventListener('click', e=>{ if(e.target.id==='configOverlay'){ state.configOpen=false; render(); } });
  document.getElementById('configCancel').addEventListener('click', ()=>{ state.configOpen=false; render(); });

  const addBtn = document.getElementById('addWsBtn');
  if(addBtn) addBtn.addEventListener('click', ()=>{ state.configEditingId = 'new'; render(); });

  const cancelForm = document.getElementById('wsFormCancel');
  if(cancelForm) cancelForm.addEventListener('click', ()=>{ state.configEditingId = null; render(); });

  document.querySelectorAll('[data-edit-ws]').forEach(b=>b.addEventListener('click', ()=>{
    state.configEditingId = b.dataset.editWs; render();
  }));
  document.querySelectorAll('[data-del-ws]').forEach(b=>b.addEventListener('click', ()=>{
    const ws = state.workspaces.find(w=>w.id===b.dataset.delWs);
    if(confirm(`Remover a área "${ws?.name}" deste aparelho? Isso não apaga a planilha, só esquece a conexão aqui.`)){
      removeWorkspace(b.dataset.delWs);
      render();
    }
  }));

  const testBtn = document.getElementById('wsTestBtn');
  if(testBtn) testBtn.addEventListener('click', async ()=>{
    const url = document.getElementById('wsUrlInput').value.trim();
    const token = document.getElementById('wsTokenInput').value.trim();
    const box = document.getElementById('wsResult');
    if(!url || !token){ box.textContent = 'Preencha URL e token antes de testar.'; box.style.color='var(--red)'; return; }
    box.textContent = 'Testando…'; box.style.color = 'var(--text-dim)';
    try{
      const sep = url.includes('?') ? '&' : '?';
      const res = await fetch(url + sep + 'token=' + encodeURIComponent(token));
      const data = await res.json();
      if(data.ok===false || data.error) throw new Error(data.error||'acesso negado');
      box.textContent = `Conectado! ${(data.transactions||[]).length} lançamento(s) e ${(data.history||[]).length} registro(s) de histórico encontrados na planilha.`;
      box.style.color = 'var(--green)';
    }catch(e){
      box.textContent = 'Falha: ' + e.message + '. Confira se o token bate com o SECRET_TOKEN do script e se você reimplantou uma "Nova versão" depois de editar.';
      box.style.color = 'var(--red)';
    }
  });

  const saveBtn = document.getElementById('wsSaveBtn');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    const name = document.getElementById('wsNameInput').value.trim();
    const preset = document.getElementById('wsPresetInput').value;
    const url = document.getElementById('wsUrlInput').value.trim();
    const token = document.getElementById('wsTokenInput').value.trim();
    if(!name || !url || !token){ showToast('Preencha nome, URL e token antes de salvar.'); return; }
    const isNew = state.configEditingId==='new' || !state.workspaces.find(w=>w.id===state.configEditingId);
    const id = isNew ? uid() : state.configEditingId;
    upsertWorkspace({id, name, scriptUrl:url, scriptToken:token, categoryPreset:preset});
    state.configEditingId = null;
    if(isNew || state.activeWorkspaceId===id){
      setActiveWorkspace(id);
    }
    state.configOpen = false; render();
    await refreshFromServer(false);
  });
}

/* ================= EXPORT EXCEL ================= */
const CURRENCY_FMT = '"R$" #,##0.00';

// Aplica formato de moeda a colunas específicas (por rótulo do cabeçalho) de
// uma planilha gerada por XLSX.utils.json_to_sheet.
function applyCurrencyFormat_(ws, headerLabels, moneyLabels, numRows){
  moneyLabels.forEach(label=>{
    const colIdx = headerLabels.indexOf(label);
    if(colIdx===-1) return;
    const colLetter = XLSX.utils.encode_col(colIdx);
    for(let r=0;r<numRows;r++){
      const ref = colLetter + (r+2); // +2: linha 1 é o cabeçalho
      if(ws[ref]) ws[ref].z = CURRENCY_FMT;
    }
  });
}

function exportExcel(){
  const list = periodTransactions().sort((a,b)=>a.date.localeCompare(b.date));
  if(list.length===0){ showToast('Não há lançamentos para exportar neste período.'); return; }

  const rows = list.map(t=>({
    'Data': fmtDate(t.date),
    'Tipo': t.type==='receita'?'Receita':'Despesa',
    'Categoria': catById(t.categoryId)?.label||'',
    'Descrição': t.description,
    'Nº NF': t.nf||'',
    'Valor': t.value,
    'Forma de Pagamento': t.paymentMethod||'',
    'Sócio': t.partner||'',
    'Conciliado': t.reconciled?'Sim':'Não',
    'Nota do Extrato': t.bankNote||'',
  }));
  const txHeaders = ['Data','Tipo','Categoria','Descrição','Nº NF','Valor','Forma de Pagamento','Sócio','Conciliado','Nota do Extrato'];
  const ws = XLSX.utils.json_to_sheet(rows, {header:txHeaders});
  ws['!cols'] = [{wch:11},{wch:9},{wch:24},{wch:32},{wch:10},{wch:12},{wch:16},{wch:14},{wch:11},{wch:18}];
  applyCurrencyFormat_(ws, txHeaders, ['Valor'], rows.length);

  // Resumo mensal — visão geral de TODOS os meses lançados, independente do
  // filtro de período selecionado no momento da exportação.
  const monthsAll = Array.from(new Set(state.transactions.map(t=>t.date.slice(0,7)))).sort();
  const resumoRows = monthsAll.map(m=>{
    const mt = state.transactions.filter(t=>t.date.slice(0,7)===m);
    const d = dreData(mt);
    return {
      'Mês': monthLabel(m),
      'Faturamento': d.receitaBruta,
      'Deduções': d.deducoes,
      'CMV': d.cmv,
      'Despesas Operacionais': d.opex,
      'Retiradas': d.naoOperacional,
      'Lucro Líquido': d.lucroLiquido,
      'Lançamentos': mt.length,
    };
  });
  const resumoHeaders = ['Mês','Faturamento','Deduções','CMV','Despesas Operacionais','Retiradas','Lucro Líquido','Lançamentos'];
  const wsResumo = XLSX.utils.json_to_sheet(resumoRows, {header:resumoHeaders});
  wsResumo['!cols'] = [{wch:16},{wch:14},{wch:12},{wch:12},{wch:20},{wch:12},{wch:14},{wch:12}];
  applyCurrencyFormat_(wsResumo, resumoHeaders, ['Faturamento','Deduções','CMV','Despesas Operacionais','Retiradas','Lucro Líquido'], resumoRows.length);

  const histRows = [...state.history].sort((a,b)=>b.timestamp.localeCompare(a.timestamp)).map(h=>({
    'Quando': fmtDateTime(h.timestamp),
    'Ação': h.action==='exportar'?'Exportado':'Salvo',
    'Período': h.period==='all'?'Todo o período':monthLabel(h.period),
    'Lançamentos': h.totalLancamentos,
    'Faturamento': h.receitaBruta,
    'Despesas': h.despesasTotais,
    'Lucro Líquido': h.lucroLiquido,
    'Observação': h.note||'',
  }));
  const histHeaders = ['Quando','Ação','Período','Lançamentos','Faturamento','Despesas','Lucro Líquido','Observação'];
  const wsHist = XLSX.utils.json_to_sheet(histRows, {header:histHeaders});
  wsHist['!cols'] = [{wch:17},{wch:10},{wch:16},{wch:12},{wch:14},{wch:14},{wch:14},{wch:26}];
  applyCurrencyFormat_(wsHist, histHeaders, ['Faturamento','Despesas','Lucro Líquido'], histRows.length);

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Lançamentos');
  XLSX.utils.book_append_sheet(wb, wsResumo, 'Resumo Mensal');
  XLSX.utils.book_append_sheet(wb, wsHist, 'Histórico');

  const label = state.period==='all' ? 'todos' : state.period;
  XLSX.writeFile(wb, `lorian-financeiro-${label}.xlsx`);
}

init();
